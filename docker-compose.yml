# =============================================================================
# Authentik Media Gateway - Docker Compose
# =============================================================================
# Usage:
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Logs:    docker compose logs -f api
#   Rebuild: docker compose up -d --build
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: media-gateway-minio
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"  # S3 API (host 19000 to avoid conflict with Authentik on 9000)
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO bucket initialization
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: media-gateway-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${S3_BUCKET} --ignore-existing;
      mc anonymous set none myminio/$${S3_BUCKET};
      echo 'Bucket $${S3_BUCKET} created successfully';
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-media-gateway}

  # ---------------------------------------------------------------------------
  # Authentik Media Gateway API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-gateway-api
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-media-gateway}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-uploads/}
      S3_PRESIGNED_TTL_SECONDS: ${S3_PRESIGNED_TTL_SECONDS:-300}
      S3_TIMEOUT_SECONDS: ${S3_TIMEOUT_SECONDS:-30}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-10485760}
      ALLOWED_CONTENT_TYPES: ${ALLOWED_CONTENT_TYPES:-["audio/wav", "audio/webm", "audio/mpeg"]}
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (optional - for future caching/sessions)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: media-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
  redis_data:
    driver: local
