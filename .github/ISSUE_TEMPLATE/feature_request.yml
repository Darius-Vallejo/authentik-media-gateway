name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the feature and its motivation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve? Why is it useful?
      placeholder: e.g. "As an Authentik operator I want to ... so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could this work? (API changes, new endpoints, config, etc.)
      placeholder: Describe the feature and any design you have in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does this fit?
      options:
        - API (presigned-url, verify, health)
        - Processors (voice, OCR, face)
        - Storage / S3
        - Config / deployment
        - Documentation
        - Other
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This aligns with project goals (see README Non-goals)
          required: false
